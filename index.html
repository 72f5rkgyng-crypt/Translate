<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Переводчик">
<meta name="theme-color" content="#000000">
<title>Переводчик</title>
<style>
  :root { --text: #5c5c5c; --ui: #444; --ui-line: #2a2a2a; --on: #2f7a4d; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--text); overflow: hidden; touch-action: manipulation; -webkit-touch-callout: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #out {
    color: var(--text); width: 100%; max-height: 100%; overflow-y: auto; box-sizing: border-box;
    padding: 56px 28px; text-align: center;
    font-size: clamp(28px, 6vw, 64px); line-height: 1.3; font-weight: 500; word-break: break-word;
  }
  #out.hint { font-size: clamp(20px, 4.5vw, 36px); color: var(--ui); }
  #bar {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; font-size: 13px; color: var(--ui);
  }
  #lang { background: none; border: 1px solid var(--ui-line); color: var(--ui); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 15px; cursor: pointer; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ui-line); display: inline-block; margin-right: 8px; }
  #dot.on { background: var(--on); }
  #msg.err { color: #d9704f; }
  #mic {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 68px; height: 68px; border-radius: 50%; padding: 0;
    background: none; border: 2px solid var(--text); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #mic svg { width: 28px; height: 28px; fill: currentColor; }
  #mic.on { background: var(--text); color: #000; }
</style>
</head>
<body>
<div id="bar">
  <button id="lang">RU → ES</button>
  <span><span id="dot"></span><span id="msg">микрофон выключен</span></span>
</div>
<div id="out"></div>
<button id="mic" aria-label="Микрофон"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H9.5a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H13v-2.6a6 6 0 0 0 5-5.9z"/></svg></button>

<script>
(function () {
  const out = document.getElementById('out');
  const msg = document.getElementById('msg');
  const dot = document.getElementById('dot');
  const langBtn = document.getElementById('lang');
  const micBtn = document.getElementById('mic');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const CODES = { ru: 'ru-RU', es: 'es-ES' };
  const SAY = { ru: 'Говорите по-русски', es: 'Говорите по-испански' };
  let from = 'ru', to = 'es';
  let listening = false, rec = null;
  let finalBuf = '', lastTime = 0, timer = null, seq = 0;
  let current = '', hist = [], viewIdx = -1;
  const translators = {};

  function archive() { if (current) { hist.push(current); if (hist.length > 50) hist.shift(); current = ''; } }
  function status(t, err) { msg.textContent = t; msg.classList.toggle('err', !!err); }
  function show(t, hint) { out.classList.toggle('hint', !!hint); out.textContent = t; }

  if (!SR) status('нужен Safari или Chrome', true);

  // ---------- Перевод ----------
  async function viaChrome(text) {
    if (!('Translator' in self)) return null;
    const key = from + to;
    if (translators[key] === undefined) {
      try {
        const a = await Translator.availability({ sourceLanguage: from, targetLanguage: to });
        translators[key] = a === 'unavailable' ? null : await Translator.create({ sourceLanguage: from, targetLanguage: to });
      } catch (e) { translators[key] = null; }
    }
    return translators[key] ? await translators[key].translate(text) : null;
  }
  async function viaGoogle(text) {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + from +
      '&tl=' + to + '&q=' + encodeURIComponent(text));
    const d = await r.json();
    return d[0].map(x => x[0]).join('');
  }
  async function viaMyMemory(text) {
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 450)) +
      '&langpair=' + from + '|' + to);
    const d = await r.json();
    if (d.responseStatus != 200) throw new Error('mm');
    return d.responseData.translatedText;
  }
  async function translate(text) {
    for (const fn of [viaChrome, viaGoogle, viaMyMemory]) {
      try { const res = await fn(text); if (res) return res; } catch (e) {}
    }
    throw new Error('no translator');
  }

  function schedule(text) {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        const res = await translate(text);
        if (my === seq) { current = res; viewIdx = -1; show(res); out.scrollTop = out.scrollHeight; if (listening) status('слушаю…'); }
      } catch (e) { status('перевод не удался — нет сети?', true); }
    }, 400);
  }

  // ---------- Распознавание (короткие сессии с автоперезапуском) ----------
  function startRec() {
    if (!SR) return;
    const r = new SR();
    rec = r;
    r.lang = CODES[from];
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onresult = (ev) => {
      const now = Date.now();
      if (finalBuf && now - lastTime > 5000) { finalBuf = ''; archive(); }
      lastTime = now;
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalBuf += t + ' '; else interim += t;
      }
      const full = (finalBuf + interim).trim();
      if (full) schedule(full);
    };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        status('нет доступа: микрофон или диктовка выключены', true); stop();
      } else if (e.error === 'audio-capture') { status('микрофон не найден', true); stop(); }
      else if (e.error === 'network') status('нет сети для распознавания', true);
      else if (e.error !== 'no-speech' && e.error !== 'aborted') status('ошибка: ' + e.error, true);
    };
    r.onend = () => {
      if (!listening || rec !== r) return;
      setTimeout(() => {
        if (!listening || rec !== r) return;
        try { r.start(); } catch (e) { startRec(); }
      }, 200);
    };
    try { r.start(); } catch (e) { status('не удалось запустить микрофон', true); }
  }
  function killRec() {
    const old = rec; rec = null;
    if (old) { old.onend = null; old.onerror = null; old.onresult = null; try { old.abort(); } catch (e) {} }
  }
  function restartRec() { killRec(); setTimeout(() => { if (listening) startRec(); }, 300); }

  function start() {
    if (!SR) return;
    listening = true; dot.classList.add('on'); micBtn.classList.add('on'); status('слушаю…');
    startRec();
  }
  function stop() {
    listening = false; dot.classList.remove('on'); micBtn.classList.remove('off'); micBtn.classList.remove('on'); status('микрофон выключен');
    killRec();
  }

  // ---------- Жесты ----------
  function showPrev() {
    if (viewIdx === -1) viewIdx = current ? hist.length - 1 : hist.length - 2;
    else if (viewIdx > 0) viewIdx--;
    if (viewIdx >= 0 && hist[viewIdx] !== undefined) show(hist[viewIdx]); else viewIdx = -1;
  }
  function newSentence() {
    archive(); finalBuf = ''; viewIdx = -1; seq++; clearTimeout(timer);
    show('');
    if (listening) { status('новое предложение'); restartRec(); setTimeout(() => { if (listening) status('слушаю…'); }, 900); }
  }

  // 1 тап по экрану = новое предложение; 2 тапа = предыдущее предложение + микрофон выключается.
  // Микрофон включается и выключается кнопкой внизу.
  let lastTap = 0, tapTimer = null;
  micBtn.addEventListener('click', (e) => { e.stopPropagation(); listening ? stop() : start(); });
  document.body.addEventListener('contextmenu', (e) => e.preventDefault());
  document.body.addEventListener('pointerup', (e) => {
    if (e.target.closest('button')) return;
    const now = Date.now();
    if (now - lastTap < 320) {
      clearTimeout(tapTimer); lastTap = 0;
      clearTimeout(timer); seq++;
      if (listening) stop();
      showPrev();
      return;
    }
    lastTap = now; tapTimer = setTimeout(newSentence, 320);
  });

  // ---------- Смена языка ----------
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    [from, to] = [to, from];
    langBtn.textContent = from.toUpperCase() + ' → ' + to.toUpperCase();
    archive(); finalBuf = ''; seq++; clearTimeout(timer);
    const hint = SAY[from];
    show(hint, true);
    setTimeout(() => { if (out.textContent === hint) show(''); }, 1800);
    if (listening) restartRec();
  });
})();
</script>
</body>
</html>
